<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS SOC v2</title><style>
body{font-family:Inter,system-ui;background:#0b1020;color:#e8edf7;margin:0}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#121a2b;border:1px solid #25304a;border-radius:14px;padding:18px}.metric{font-size:30px;font-weight:800}.muted{color:#94a3b8}.incident{display:flex;justify-content:space-between;align-items:center;padding:14px;border-top:1px solid #25304a}.risk{font-weight:800;font-size:22px}.pill{padding:5px 9px;border-radius:999px;background:#26324b}.btn{background:#e8edf7;color:#0b1020;border:0;padding:10px 14px;border-radius:10px;cursor:pointer}.mono{font-family:ui-monospace,monospace}.small{font-size:13px}
</style></head><body><main><h1>AEGIS SOC Command Center</h1><p class="muted">Evidence-first incident intelligence • MITRE ATT&CK v19.2 • human-in-the-loop</p><div class="grid"><div class="card"><div class="muted">Raw alerts</div><div id="alerts" class="metric">—</div></div><div class="card"><div class="muted">Correlated incidents</div><div id="incidents" class="metric">—</div></div><div class="card"><div class="muted">Critical</div><div id="critical" class="metric">—</div></div><div class="card"><div class="muted">Ranking</div><div id="model" class="metric small">—</div></div></div><br><button class="btn" onclick="simulate()">Run attack replay</button><div class="card" style="margin-top:18px"><h2>Priority queue</h2><div id="queue">Loading…</div></div><div id="detail" class="card" style="margin-top:18px;display:none"></div></main><script>
async function load(){let r=await fetch('/api/overview');let d=await r.json();for(let k of ['alerts','incidents','critical'])document.getElementById(k).textContent=d[k];document.getElementById('model').textContent=d.models.join(', ');document.getElementById('queue').innerHTML=d.top.map(x=>`<div class="incident" onclick="openI('${x.id}')"><div><b>${x.id}</b> <span class="pill">${x.severity}</span><div>${x.title}</div><div class="muted small">${x.alerts} alerts • ${x.model}</div></div><div class="risk">${x.risk}</div></div>`).join('')}async function openI(id){let r=await fetch('/api/incidents/'+id);let d=await r.json();let i=d.incident;document.getElementById('detail').style.display='block';document.getElementById('detail').innerHTML=`<h2>${i.incident_id}: ${i.title}</h2><p><b>Risk:</b> ${i.risk_score} • <b>Model:</b> ${i.ranking_model}</p><p><b>Why grouped:</b> ${(i.correlation_reasons||[]).join(' • ')}</p><p><b>ATT&CK:</b> ${(i.mitre||[]).map(x=>x.technique_id+' '+x.name+' ('+x.status+')').join(' • ')||'Insufficient evidence'}</p><h3>Evidence</h3>${d.evidence.map(e=>`<div class="small mono">${e.evidence_id} — ${e.statement}</div>`).join('')}<h3>AI / analyst brief</h3><p>${i.summary}</p>`}async function simulate(){let r=await fetch('/api/simulate',{method:'POST'});let d=await r.json();alert('Replay produced '+d.alerts+' alerts and '+d.incidents.length+' correlated incident(s).');load()}load();
</script></body></html>
